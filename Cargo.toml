[workspace]
members = ["crates/*"]
resolver = "3"

# mirror SonarQube rules rust:S3776 (cognitive complexity) and rust:S1612 (redundant closure)
[workspace.lints.clippy]
cognitive_complexity = "warn"
redundant_closure_for_method_calls = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"

[profile.release.package.tc-core]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.regex-syntax]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.encoding_rs]
opt-level = 3
