[package]
name = "tc-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
suppaftp = { version = "12.2.1", features = ["rustls-ring"] }
tc-core = { version = "0.1.0", path = "../tc-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time"] }
webpki-roots = "1.0.12"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
