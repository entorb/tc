[package]
name = "tc-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
chardetng = "1.0.0"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
ignore = "0.4.34"
jiff = "1.0.1"
lzma-rust2 = { version = "0.25.0", features = ["xz"] }
regex = "1.13.1"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["disk", "system", "user"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.3.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[features]
# in-memory Remote for tests of dependent crates
mem = []

[dev-dependencies]
lzma-rust2 = { version = "0.25.0", features = ["xz", "encoder"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
