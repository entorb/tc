[package]
name = "tc-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
lzma-rust2 = { version = "0.25.0", features = ["xz"] }
regex = "1.13.2"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["disk", "system"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.4.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
lzma-rust2 = { version = "0.25.0", features = ["xz", "encoder"] }

[lints]
workspace = true
