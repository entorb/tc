[package]
name = "tc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["osc52", "bracketed-paste"] }
jiff = "1.0.1"
ratatui = "0.30.2"
regex = "1.13.2"
tc-core = { version = "0.1.0", path = "../tc-core" }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
