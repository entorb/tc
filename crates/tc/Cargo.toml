[package]
name = "tc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", default-features = false }
jiff = "1.0.1"
regex = "1.13.1"
tc-core = { version = "0.1.0", path = "../tc-core" }
tc-remote = { version = "0.1.0", path = "../tc-remote" }
tempfile = "3.27.0"
unicode-width = "0.2"

[dev-dependencies]
tc-core = { version = "0.1.0", path = "../tc-core", features = ["mem"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
